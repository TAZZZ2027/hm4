[project]
name = "hm4"
version = "0.1.0"
description = "A cheerful desktop app for exploring CSV data"
readme = "README.md"
authors = [
    { name = "Tal Zer", email = "tal.zer@s.afeka.ac.il" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8.0",
    "pyside6>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
